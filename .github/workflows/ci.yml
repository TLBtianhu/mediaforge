name: CI

on:
  pull_request:
  # 不再监听 push：每次提交都跑会制造大量通知；需要验证时手动 dispatch。
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  runtime-safety:
    name: Runtime safety (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify runtime plans, activation recovery, and offline package updates
        run: python -m unittest discover -s tests/python -t tests -p "test_runtime_core_*.py"
      - name: Verify runtime pruning and preparation probes
        run: |
          python -m unittest discover -s tests/python -t tests -p "test_runtime_pruning.py"
          python -m unittest discover -s tests/python -t tests -p "test_prepare_runtime_probe.py"
          python -m unittest discover -s tests/python -t tests -p "test_release_core_resolution.py"
      - name: Verify optional components preserve the fixed runtime
        run: python -m unittest discover -s tests/python -t tests -p "test_worker_optional_packages.py"

  linux-native:
    name: Linux native runtime and backend
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential pkg-config \
            libasound2-dev libwebkit2gtk-4.1-dev libssl-dev libxdo-dev libayatana-appindicator3-dev librsvg2-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify Linux release and environment contracts
        run: python -m unittest discover -s tests/python -t tests -p 'test_linux_*.py'
      - name: Check backend and bootstrap relocation
        run: |
          cargo check --manifest-path src-tauri/Cargo.toml
          cargo test --manifest-path src-tauri/Cargo.toml bootstrap_cache
          cargo test --manifest-path src-tauri/Cargo.toml trusted_digest_is_bound_to_the_same_bytes_as_the_signature
          cargo test --manifest-path src-tauri/Cargo.toml single_instance

  macos-native:
    name: macOS native checks
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify single instance and bundled bootstrap
        run: |
          cargo test --manifest-path src-tauri/Cargo.toml single_instance
          cargo test --manifest-path src-tauri/Cargo.toml bundled_bootstrap_uses_user_overlay_without_changing_bundle
      - name: Verify plugin resources and native protocol paths
        run: |
          python -m pip install --disable-pip-version-check --prefer-binary "numpy>=1.26,<3"
          python -m unittest discover -s tests/python -t tests -p 'test_plugin_sdk_bundle.py'
          python -m unittest discover -s tests/python -t tests -p 'test_audio_tool_output_safety.py'
          cargo test --manifest-path src-tauri/Cargo.toml plugin_views
          cargo test --manifest-path src-tauri/Cargo.toml python::worker

  validate:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.2

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Python test dependencies
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check --upgrade pip
          python -m pip install --disable-pip-version-check --prefer-binary \
            --index-url https://download.pytorch.org/whl/cpu \
            torch==2.7.1+cpu
          python -m pip install --disable-pip-version-check --prefer-binary \
            -r python/requirements-ci.txt

      - name: Check architecture invariants
        run: python scripts/check-architecture.py

      - name: Check the worker command surface
        run: python scripts/check-command-surface.py --strict

      - name: Verify the MCP bridge contract for DSH
        run: python scripts/smoke_mcp.py

      - name: Run all tests
        run: pnpm test:all

      - name: Build frontend
        run: pnpm build

      - name: Check Tauri backend
        run: cargo check --manifest-path src-tauri/Cargo.toml

  runtime-lifecycle:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build the real release executable
        run: cargo build --release --manifest-path src-tauri/Cargo.toml
      - name: Verify the development executable keeps its data in the repository
        shell: pwsh
        run: ./scripts/smoke-dev-data-root.ps1 -AppExe 'src-tauri\target\release\pymss-studio.exe'
      - name: Verify runtime install, reuse and rollback end to end
        shell: pwsh
        run: |
          $stage = Join-Path $env:RUNNER_TEMP 'mediaforge-runtime-smoke'
          New-Item -ItemType Directory -Force -Path "$stage\bin" | Out-Null
          Copy-Item 'src-tauri\target\release\pymss-studio.exe' "$stage\MediaForge.exe" -Force
          ./scripts/fetch-third-party.ps1 -ToolName aria2 -Destination "$stage\bin"
          ./scripts/smoke-runtime-rollback.ps1 -AppExe "$stage\MediaForge.exe"
      - name: Verify first install downloads, verifies and activates a runtime
        shell: pwsh
        run: |
          ./scripts/make-fixture-runtime.ps1 -OutZip "$env:RUNNER_TEMP\runtime-fixture.zip" -AssetId 'runtime-fixture'
          ./scripts/smoke-first-install.ps1 -AppExe "$env:RUNNER_TEMP\mediaforge-runtime-smoke\MediaForge.exe" -RuntimeZip "$env:RUNNER_TEMP\runtime-fixture.zip"
      - name: Verify the portable layout keeps its data root beside the executable
        shell: pwsh
        run: |
          $pkg = Join-Path $env:RUNNER_TEMP 'mediaforge-portable-pkg'
          New-Item -ItemType Directory -Force -Path $pkg | Out-Null
          Copy-Item 'src-tauri\target\release\pymss-studio.exe' "$pkg\MediaForge.exe" -Force
          Set-Content "$pkg\mediaforge.portable" 'portable' -Encoding ASCII
          $zip = Join-Path $env:RUNNER_TEMP 'mediaforge-portable.zip'
          & 'C:\Program Files\7-Zip\7z.exe' a -tzip -bso0 -bsp0 $zip "$pkg\*" | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "便携包压缩失败：$LASTEXITCODE" }
          ./scripts/smoke-portable.ps1 -Zip $zip

  installer-upgrade:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install Inno Setup
        run: choco install innosetup --yes --no-progress
      - name: Verify upgrade preserves data, models and runtime assets
        shell: pwsh
        run: ./scripts/smoke-upgrade.ps1
