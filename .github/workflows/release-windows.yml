          ./scripts/fetch-vcrt.ps1 -Destination "$bin/vcrt"
          $ffprobeOutput = & "$bin/ffprobe.exe" -version
          $ffprobeExitCode = $LASTEXITCODE
          $ffprobeOutput | Select-Object -First 1
          if ($ffprobeExitCode -ne 0) { throw "ffprobe.exe verification failed with exit code $ffprobeExitCode" }
      - name: Stage online bootstrap portable directory
        shell: pwsh
        run: |
          $version = '${{ steps.meta.outputs.version }}'
          $stage = "release/${{ steps.meta.outputs.stage_name }}"
          ./scripts/package-release.ps1 -Version $version -SkipBuild -StageOnly -OutputDir release -StageName '${{ steps.meta.outputs.stage_name }}' -PackageSuffix windows-x64-online
          # SDK staging is idempotent; retain the explicit release boundary check.
          ./scripts/stage-plugin-sdk.ps1 -StagePath $stage
          $verify = @'
          import pathlib, subprocess, sys, tempfile
          sys.path.insert(0, 'scripts')
          from media_smoke_env import isolated_environment
          stage = pathlib.Path(sys.argv[1]).resolve()
          bootstrap = stage / 'python-runtime/python.exe'
          with tempfile.TemporaryDirectory(prefix='MediaForge-stage-smoke-') as temporary:
              data = pathlib.Path(temporary)
              env = isolated_environment(data, bootstrap)
              subprocess.run([str(bootstrap), '-B', '-m', 'pip', '--version'], env=env, check=True, creationflags=getattr(subprocess, "CREATE_NO_WINDOW", 0))
              probe = data / 'probe-venv'
              subprocess.run([str(bootstrap), '-B', '-m', 'venv', str(probe)], env=env, check=True, creationflags=getattr(subprocess, "CREATE_NO_WINDOW", 0))
              subprocess.run([str(probe / 'Scripts/python.exe'), '-B', '-m', 'pip', '--version'], env=env, check=True, creationflags=getattr(subprocess, "CREATE_NO_WINDOW", 0))
              subprocess.run([str(bootstrap), '-B', str(stage / 'python/worker.py'), 'runtime_info', '--payload', '{}'], env=env, check=True, creationflags=getattr(subprocess, "CREATE_NO_WINDOW", 0))
          '@
          $verify | python -B - $stage
          if ($LASTEXITCODE -ne 0) { throw "Isolated staged bootstrap verification failed" }

      - name: Verify staged native plugin helper
        shell: pwsh
        run: |
          python scripts/verify-native-plugins.py "release/${{ steps.meta.outputs.stage_name }}/MediaForge.exe" --platform windows
          if ($LASTEXITCODE -ne 0) { throw "Staged native plugin helper verification failed" }
      - name: Upload online stage artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.meta.outputs.stage_artifact }}
          path: release/${{ steps.meta.outputs.stage_name }}
          compression-level: 0
  windows-online-7z:
    name: Windows x64 online portable 7z
    runs-on: windows-latest
    needs: windows-online-prepare
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.windows-online-prepare.outputs.stage_artifact }}
          path: release/${{ needs.windows-online-prepare.outputs.stage_name }}
      - name: Build online portable archive
        shell: pwsh
        run: |
          $stageName = '${{ needs.windows-online-prepare.outputs.stage_name }}'
          Set-Content "release/$stageName/mediaforge.portable" -Value "portable" -Encoding ASCII
          $updateArchive = (Resolve-Path "release").Path + "\MediaForge-${{ needs.windows-online-prepare.outputs.version }}-windows-x64-update.zip"
           Push-Location release
           & "C:\Program Files\7-Zip\7z.exe" a -t7z -m0=lzma2 -mx=5 -mfb=128 -md=64m -ms=on -mf=BCJ2 -mmt=2 "$stageName.7z" "$stageName"
           if ($LASTEXITCODE -ne 0) { throw "Unable to create the Online portable archive" }
           Pop-Location

           Push-Location "release/$stageName"
           # Keep the worker, tools, integration and manifest contract together.
           & "C:\Program Files\7-Zip\7z.exe" a -tzip $updateArchive "MediaForge.exe" "python" "bin" "integrations" "manifest"
          if ($LASTEXITCODE -ne 0) { throw "Unable to create the managed update archive" }
          Pop-Location
          $updateSize = (Get-Item -LiteralPath $updateArchive).Length
          if ($updateSize -gt 512MB) { throw "Managed update archive exceeds the 512 MiB client limit" }
      - name: Portable data-root smoke test (Online)
        shell: pwsh
        run: |
          $stageName = '${{ needs.windows-online-prepare.outputs.stage_name }}'
          ./scripts/smoke-portable.ps1 -Zip "release/$stageName.7z"

      - uses: actions/upload-artifact@v4
        with:
          name: MediaForge-${{ needs.windows-online-prepare.outputs.version }}-windows-x64-online-portable
          path: release/${{ needs.windows-online-prepare.outputs.stage_name }}.7z
      - name: Upload universal Windows update archive
        uses: actions/upload-artifact@v4
        with:
          name: MediaForge-${{ needs.windows-online-prepare.outputs.version }}-windows-x64-update
          path: release/MediaForge-${{ needs.windows-online-prepare.outputs.version }}-windows-x64-update.zip

  windows-online-exe:
    name: Windows x64 online setup exe
    runs-on: windows-latest
    needs: windows-online-prepare
    env:
      MEDIAFORGE_VERSION: ${{ needs.windows-online-prepare.outputs.version }}
      MEDIAFORGE_PACKAGE_SUFFIX: windows-x64-online
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/build-windows-installer
        with:
          version: ${{ needs.windows-online-prepare.outputs.version }}
          package-suffix: windows-x64-online
          stage-name: ${{ needs.windows-online-prepare.outputs.stage_name }}
          stage-artifact: ${{ needs.windows-online-prepare.outputs.stage_artifact }}
          output-artifact: MediaForge-${{ needs.windows-online-prepare.outputs.version }}-windows-x64-online-setup
          output-file: MediaForge-${{ needs.windows-online-prepare.outputs.version }}-windows-x64-online-setup.exe

  windows-rocm-prepare:
    name: Windows x64 ROCm prepare
    runs-on: windows-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      stage_name: ${{ steps.meta.outputs.stage_name }}
      stage_artifact: ${{ steps.meta.outputs.stage_artifact }}
    env:
      MEDIAFORGE_VERSION_INPUT: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-release-env
      - name: Resolve package metadata
        id: meta
        shell: pwsh
        run: |
          $version = $env:MEDIAFORGE_VERSION_INPUT.TrimStart('v')
          if ($version -notmatch '^\d+\.\d+\.\d+(?:-[0-9A-Za-z][0-9A-Za-z.-]*)?(?:\+[0-9A-Za-z][0-9A-Za-z.-]*)?$') { throw "Invalid semantic version: $env:MEDIAFORGE_VERSION_INPUT" }
          $stageName = "MediaForge-$version-windows-x64-rocm"
          echo "version=$version" >> $env:GITHUB_OUTPUT
          echo "stage_name=$stageName" >> $env:GITHUB_OUTPUT
          echo "stage_artifact=$stageName-stage" >> $env:GITHUB_OUTPUT
      - name: Prepare minimal bootstrap runtime
        shell: pwsh
        run: ./scripts/prepare-python-runtime.ps1 -Variant default -Minimal
      - name: Sync build version metadata
        shell: pwsh
        env:
          MEDIAFORGE_VERSION: ${{ steps.meta.outputs.version }}
        run: ./scripts/sync-build-version.ps1
      - name: Build Tauri production app
        env:
          PYMSS_BUILD_GIT_COMMIT: ${{ github.sha }}
          PYMSS_BUILD_GIT_TAG: v${{ steps.meta.outputs.version }}
          PYMSS_BUILD_GIT_REF: ${{ github.ref_name }}
          PYMSS_BUILD_RUN_ID: ${{ github.run_id }}
          PYMSS_BUILD_RUN_ATTEMPT: ${{ github.run_attempt }}
          PYMSS_BUILD_REPOSITORY: ${{ github.repository }}
          PYMSS_BUILD_REPOSITORY_OWNER: ${{ github.repository_owner }}
          PYMSS_BUILD_TARGET: windows-x64
          PYMSS_BUILD_VARIANT: windows-x64-rocm
          PYMSS_BUILD_UPDATE_SUPPORTED: 'true'
          PYMSS_BUILD_OFFICIAL: ${{ github.repository == 'TLBtianhu/mediaforge' && github.repository_owner == 'TLBtianhu' && 'true' || 'false' }}
        run: pnpm plugins:build --no-bundle
      - name: Prepare ROCm portable tools
        shell: pwsh
        run: |
          $bin = "release/bin"
          New-Item -ItemType Directory -Force -Path $bin | Out-Null
          # 外部二进制按 .github/third-party.json 固定版本与 sha256 拉取（见 scripts/fetch-third-party.ps1）
          ./scripts/fetch-third-party.ps1 -Destination $bin
          ./scripts/fetch-vcrt.ps1 -Destination "$bin/vcrt"
          $ffprobeOutput = & "$bin/ffprobe.exe" -version
          $ffprobeExitCode = $LASTEXITCODE
          $ffprobeOutput | Select-Object -First 1
          if ($ffprobeExitCode -ne 0) { throw "ffprobe.exe verification failed with exit code $ffprobeExitCode" }
      - name: Stage rocm bootstrap portable directory
        shell: pwsh
        run: |
          $version = '${{ steps.meta.outputs.version }}'
          $stage = "release/${{ steps.meta.outputs.stage_name }}"
          ./scripts/package-release.ps1 -Version $version -SkipBuild -StageOnly -OutputDir release -StageName '${{ steps.meta.outputs.stage_name }}' -PackageSuffix windows-x64-rocm
          # SDK staging is idempotent; retain the explicit release boundary check.
          ./scripts/stage-plugin-sdk.ps1 -StagePath $stage
          $verify = @'
          import pathlib, subprocess, sys, tempfile
          sys.path.insert(0, 'scripts')
          from media_smoke_env import isolated_environment
          stage = pathlib.Path(sys.argv[1]).resolve()
          bootstrap = stage / 'python-runtime/python.exe'
          with tempfile.TemporaryDirectory(prefix='MediaForge-stage-smoke-') as temporary:
              data = pathlib.Path(temporary)
              env = isolated_environment(data, bootstrap)
              subprocess.run([str(bootstrap), '-B', '-m', 'pip', '--version'], env=env, check=True, creationflags=getattr(subprocess, "CREATE_NO_WINDOW", 0))
              probe = data / 'probe-venv'
              subprocess.run([str(bootstrap), '-B', '-m', 'venv', str(probe)], env=env, check=True, creationflags=getattr(subprocess, "CREATE_NO_WINDOW", 0))
              subprocess.run([str(probe / 'Scripts/python.exe'), '-B', '-m', 'pip', '--version'], env=env, check=True, creationflags=getattr(subprocess, "CREATE_NO_WINDOW", 0))
              subprocess.run([str(bootstrap), '-B', str(stage / 'python/worker.py'), 'runtime_info', '--payload', '{}'], env=env, check=True, creationflags=getattr(subprocess, "CREATE_NO_WINDOW", 0))
          '@
          $verify | python -B - $stage
          if ($LASTEXITCODE -ne 0) { throw "Isolated staged bootstrap verification failed" }

      - name: Verify staged native plugin helper
        shell: pwsh
        run: |
          python scripts/verify-native-plugins.py "release/${{ steps.meta.outputs.stage_name }}/MediaForge.exe" --platform windows
          if ($LASTEXITCODE -ne 0) { throw "Staged native plugin helper verification failed" }
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.meta.outputs.stage_artifact }}
          path: release/${{ steps.meta.outputs.stage_name }}
          compression-level: 0

  windows-rocm-7z:
    name: Windows x64 ROCm portable 7z
    runs-on: windows-latest
    needs: windows-rocm-prepare
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.windows-rocm-prepare.outputs.stage_artifact }}
          path: release/${{ needs.windows-rocm-prepare.outputs.stage_name }}
      - name: Build ROCm portable archive
        shell: pwsh
        run: |
          $stageName = '${{ needs.windows-rocm-prepare.outputs.stage_name }}'
          Set-Content "release/$stageName/mediaforge.portable" -Value "portable" -Encoding ASCII
           Push-Location release
           & "C:\Program Files\7-Zip\7z.exe" a -t7z -m0=lzma2 -mx=5 -mfb=128 -md=64m -ms=on -mf=BCJ2 -mmt=2 "$stageName.7z" "$stageName"
           if ($LASTEXITCODE -ne 0) { throw "Unable to create the ROCm portable archive" }
           Pop-Location

      - name: Portable data-root smoke test (ROCm)
        shell: pwsh
        run: |
          $stageName = '${{ needs.windows-rocm-prepare.outputs.stage_name }}'
          ./scripts/smoke-portable.ps1 -Zip "release/$stageName.7z"

      - uses: actions/upload-artifact@v4
        with:
          name: MediaForge-${{ needs.windows-rocm-prepare.outputs.version }}-windows-x64-rocm-portable
          path: release/${{ needs.windows-rocm-prepare.outputs.stage_name }}.7z

  windows-rocm-exe:
    name: Windows x64 ROCm setup exe
    runs-on: windows-latest
    needs: windows-rocm-prepare
    env:
      MEDIAFORGE_VERSION: ${{ needs.windows-rocm-prepare.outputs.version }}
      MEDIAFORGE_PACKAGE_SUFFIX: windows-x64-rocm
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/build-windows-installer
        with:
          version: ${{ needs.windows-rocm-prepare.outputs.version }}
          package-suffix: windows-x64-rocm
          stage-name: ${{ needs.windows-rocm-prepare.outputs.stage_name }}
          stage-artifact: ${{ needs.windows-rocm-prepare.outputs.stage_artifact }}
          output-artifact: MediaForge-${{ needs.windows-rocm-prepare.outputs.version }}-windows-x64-rocm-setup
          output-file: MediaForge-${{ needs.windows-rocm-prepare.outputs.version }}-windows-x64-rocm-setup.exe
