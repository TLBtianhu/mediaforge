          $ffprobeOutput | Select-Object -First 1
          if ($ffprobeExitCode -ne 0) { throw "ffprobe.exe verification failed with exit code $ffprobeExitCode" }


      - name: Stage cpu bootstrap portable directory
        shell: pwsh
        run: |
          $version = '${{ steps.meta.outputs.version }}'
          $stage = "release/${{ steps.meta.outputs.stage_name }}"
          ./scripts/package-release.ps1 -Version $version -SkipBuild -StageOnly -OutputDir release -StageName '${{ steps.meta.outputs.stage_name }}' -PackageSuffix windows-x64-cpu
          # SDK staging is idempotent; retain the explicit release boundary check.
          ./scripts/stage-plugin-sdk.ps1 -StagePath $stage
          $verify = @'
          import pathlib, subprocess, sys, tempfile
          sys.path.insert(0, 'scripts')
          from media_smoke_env import isolated_environment
          stage = pathlib.Path(sys.argv[1]).resolve()
          bootstrap = stage / 'python-runtime/python.exe'
          with tempfile.TemporaryDirectory(prefix='MediaForge-stage-smoke-') as temporary:
              data = pathlib.Path(temporary)
