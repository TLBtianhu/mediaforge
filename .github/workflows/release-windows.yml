name: Release Windows Packages

on:
  workflow_call:
    inputs:
      version:
        description: Release version
        required: true
        type: string

jobs:
  windows-cuda-prepare:
    name: Windows x64 CUDA prepare
    runs-on: windows-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      stage_name: ${{ steps.meta.outputs.stage_name }}
      stage_artifact: ${{ steps.meta.outputs.stage_artifact }}
    env:
      MEDIAFORGE_VERSION_INPUT: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-release-env

      - name: Resolve package metadata
        id: meta
        shell: pwsh
        run: |
          $version = $env:MEDIAFORGE_VERSION_INPUT.TrimStart('v')
          if ($version -notmatch '^\d+\.\d+\.\d+(?:-[0-9A-Za-z][0-9A-Za-z.-]*)?(?:\+[0-9A-Za-z][0-9A-Za-z.-]*)?$') { throw "Invalid semantic version: $env:MEDIAFORGE_VERSION_INPUT" }
          $stageName = "MediaForge-$version-windows-x64-cuda"
          $artifactName = "$stageName-stage"
          echo "version=$version" >> $env:GITHUB_OUTPUT
          echo "stage_name=$stageName" >> $env:GITHUB_OUTPUT
          echo "stage_artifact=$artifactName" >> $env:GITHUB_OUTPUT

      - name: Prepare minimal bootstrap runtime
        shell: pwsh
        run: ./scripts/prepare-python-runtime.ps1 -Variant default -Minimal

      - name: Sync build version metadata
        shell: pwsh
        env:
          MEDIAFORGE_VERSION: ${{ steps.meta.outputs.version }}
        run: ./scripts/sync-build-version.ps1

      - name: Build Tauri production app
        env:
          PYMSS_BUILD_GIT_COMMIT: ${{ github.sha }}
          PYMSS_BUILD_GIT_TAG: v${{ steps.meta.outputs.version }}
          PYMSS_BUILD_GIT_REF: ${{ github.ref_name }}
          PYMSS_BUILD_RUN_ID: ${{ github.run_id }}
          PYMSS_BUILD_RUN_ATTEMPT: ${{ github.run_attempt }}
          PYMSS_BUILD_REPOSITORY: ${{ github.repository }}
          PYMSS_BUILD_REPOSITORY_OWNER: ${{ github.repository_owner }}
          PYMSS_BUILD_TARGET: windows-x64
          PYMSS_BUILD_VARIANT: windows-x64-cuda
          PYMSS_BUILD_UPDATE_SUPPORTED: 'true'
          PYMSS_BUILD_OFFICIAL: ${{ github.repository == 'TLBtianhu/mediaforge' && github.repository_owner == 'TLBtianhu' && 'true' || 'false' }}
        run: pnpm plugins:build --no-bundle

      - name: Prepare Windows bundled tools
        shell: pwsh
        run: |
          $bin = "release/bin"
          New-Item -ItemType Directory -Force -Path $bin | Out-Null

          # 外部二进制按 .github/third-party.json 固定版本与 sha256 拉取。
          # 以前这里直接下 ffmpeg-release-essentials.zip（浮动最新版），
          # 上游一发布新版本，构建出来的包就换了 ffmpeg，且无人察觉。
          ./scripts/fetch-third-party.ps1 -Destination $bin
          ./scripts/fetch-vcrt.ps1 -Destination "$bin/vcrt"
          $ffprobeOutput = & "$bin/ffprobe.exe" -version
          $ffprobeExitCode = $LASTEXITCODE
          $ffprobeOutput | Select-Object -First 1
          if ($ffprobeExitCode -ne 0) { throw "ffprobe.exe verification failed with exit code $ffprobeExitCode" }


      - name: Stage cuda bootstrap portable directory
        shell: pwsh
        run: |
          $version = '${{ steps.meta.outputs.version }}'
          $stage = "release/${{ steps.meta.outputs.stage_name }}"
          ./scripts/package-release.ps1 -Version $version -SkipBuild -StageOnly -OutputDir release -StageName '${{ steps.meta.outputs.stage_name }}' -PackageSuffix windows-x64-cuda
          # SDK staging is idempotent; retain the explicit release boundary check.
          ./scripts/stage-plugin-sdk.ps1 -StagePath $stage
          $verify = @'
          import pathlib, subprocess, sys, tempfile
          sys.path.insert(0, 'scripts')
          from media_smoke_env import isolated_environment
          stage = pathlib.Path(sys.argv[1]).resolve()
          bootstrap = stage / 'python-runtime/python.exe'
          with tempfile.TemporaryDirectory(prefix='MediaForge-stage-smoke-') as temporary:
              data = pathlib.Path(temporary)
              env = isolated_environment(data, bootstrap)
              subprocess.run([str(bootstrap), '-B', '-m', 'pip', '--version'], env=env, check=True, creationflags=getattr(subprocess, "CREATE_NO_WINDOW", 0))
              probe = data / 'probe-venv'
              subprocess.run([str(bootstrap), '-B', '-m', 'venv', str(probe)], env=env, check=True, creationflags=getattr(subprocess, "CREATE_NO_WINDOW", 0))
              subprocess.run([str(probe / 'Scripts/python.exe'), '-B', '-m', 'pip', '--version'], env=env, check=True, creationflags=getattr(subprocess, "CREATE_NO_WINDOW", 0))
              subprocess.run([str(bootstrap), '-B', str(stage / 'python/worker.py'), 'runtime_info', '--payload', '{}'], env=env, check=True, creationflags=getattr(subprocess, "CREATE_NO_WINDOW", 0))
          '@
          $verify | python -B - $stage
          if ($LASTEXITCODE -ne 0) { throw "Isolated staged bootstrap verification failed" }

      - name: Verify staged native plugin helper
        shell: pwsh
        run: |
          python scripts/verify-native-plugins.py "release/${{ steps.meta.outputs.stage_name }}/MediaForge.exe" --platform windows
          if ($LASTEXITCODE -ne 0) { throw "Staged native plugin helper verification failed" }
      - name: Upload CUDA stage artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.meta.outputs.stage_artifact }}
          path: release/${{ steps.meta.outputs.stage_name }}
          compression-level: 0

  windows-cuda-7z:
    name: Windows x64 CUDA portable 7z
    runs-on: windows-latest
    needs: windows-cuda-prepare
    steps:
      - name: Download CUDA stage artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.windows-cuda-prepare.outputs.stage_artifact }}
          path: release/${{ needs.windows-cuda-prepare.outputs.stage_name }}

      - name: Build Windows portable 7z archive
        shell: pwsh
        run: |
          $version = '${{ needs.windows-cuda-prepare.outputs.version }}'
          $stageName = '${{ needs.windows-cuda-prepare.outputs.stage_name }}'
          if (Test-Path "release/$stageName.7z") { Remove-Item "release/$stageName.7z" -Force }
          Set-Content "release/$stageName/mediaforge.portable" -Value "portable" -Encoding ASCII
           Push-Location "release"
           & "C:\Program Files\7-Zip\7z.exe" a -t7z -m0=lzma2 -mx=5 -mfb=128 -md=64m -ms=on -mf=BCJ2 -mmt=2 "$stageName.7z" "$stageName"
           if ($LASTEXITCODE -ne 0) { throw "Unable to create the CUDA portable archive" }
           Pop-Location

      - name: Portable data-root smoke test (CUDA)
        shell: pwsh
        run: |
          $stageName = '${{ needs.windows-cuda-prepare.outputs.stage_name }}'
          ./scripts/smoke-portable.ps1 -Zip "release/$stageName.7z"

      - name: Upload Windows portable archive artifact
        uses: actions/upload-artifact@v4
        with:
          name: MediaForge-${{ needs.windows-cuda-prepare.outputs.version }}-windows-x64-cuda-portable
          path: release/${{ needs.windows-cuda-prepare.outputs.stage_name }}.7z

  windows-cuda-exe:
    name: Windows x64 CUDA setup exe
    runs-on: windows-latest
    needs: windows-cuda-prepare
    env:
      MEDIAFORGE_VERSION: ${{ needs.windows-cuda-prepare.outputs.version }}
      MEDIAFORGE_PACKAGE_SUFFIX: windows-x64-cuda
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/build-windows-installer
        with:
          version: ${{ needs.windows-cuda-prepare.outputs.version }}
          package-suffix: windows-x64-cuda
          stage-name: ${{ needs.windows-cuda-prepare.outputs.stage_name }}
          stage-artifact: ${{ needs.windows-cuda-prepare.outputs.stage_artifact }}
          output-artifact: MediaForge-${{ needs.windows-cuda-prepare.outputs.version }}-windows-x64-cuda-setup
          output-file: MediaForge-${{ needs.windows-cuda-prepare.outputs.version }}-windows-x64-cuda-setup.exe

  windows-cpu-prepare:
    name: Windows x64 CPU prepare
    runs-on: windows-latest
    outputs:
