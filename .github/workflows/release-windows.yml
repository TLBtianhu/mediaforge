        run: |
          $stageName = '${{ needs.windows-cpu-prepare.outputs.stage_name }}'
          ./scripts/smoke-portable.ps1 -Zip "release/$stageName.7z"

      - name: Upload Windows CPU portable archive artifact
        uses: actions/upload-artifact@v4
        with:
          name: MediaForge-${{ needs.windows-cpu-prepare.outputs.version }}-windows-x64-cpu-portable
