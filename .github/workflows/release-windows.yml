              subprocess.run([str(probe / 'Scripts/python.exe'), '-B', '-m', 'pip', '--version'], env=env, check=True, creationflags=getattr(subprocess, "CREATE_NO_WINDOW", 0))
              subprocess.run([str(bootstrap), '-B', str(stage / 'python/worker.py'), 'runtime_info', '--payload', '{}'], env=env, check=True, creationflags=getattr(subprocess, "CREATE_NO_WINDOW", 0))
          '@
          $verify | python -B - $stage
          if ($LASTEXITCODE -ne 0) { throw "Isolated staged bootstrap verification failed" }

      - name: Verify staged native plugin helper
        shell: pwsh
        run: |
          python scripts/verify-native-plugins.py "release/${{ steps.meta.outputs.stage_name }}/MediaForge.exe" --platform windows
          if ($LASTEXITCODE -ne 0) { throw "Staged native plugin helper verification failed" }
      - name: Upload CPU stage artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.meta.outputs.stage_artifact }}
