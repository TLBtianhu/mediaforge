name: Build Windows installer
description: Build and upload an Inno Setup installer from a staged Windows package
inputs:
  version:
    description: Normalized package version
    required: true
  package-suffix:
    description: Installer package suffix
    required: true
  stage-name:
    description: Staged package directory name
    required: true
  stage-artifact:
    description: Staged package artifact name
    required: true
  output-artifact:
    description: Uploaded installer artifact name
    required: true
  output-file:
    description: Generated installer filename
    required: true
runs:
  using: composite
  steps:
    - name: Install Inno Setup 7 x64
      shell: pwsh
      run: |
        $innoVersion = "7.1.0"
        $innoTag = "is-" + $innoVersion.Replace(".", "_")
        $innoDir = Join-Path $env:RUNNER_TEMP "inno-setup-$innoVersion-x64"
        $installer = Join-Path $env:RUNNER_TEMP "innosetup-$innoVersion-x64.exe"
        Invoke-WebRequest -Uri "https://github.com/jrsoftware/issrc/releases/download/$innoTag/innosetup-$innoVersion-x64.exe" -OutFile $installer
        $expectedHash = "0362a383ed217d4c4239b5933866dd96d3eb2102737da92f80f6057a4b40df2f"
        if ((Get-FileHash -Path $installer -Algorithm SHA256).Hash -ne $expectedHash) {
          throw "Inno Setup installer SHA256 verification failed"
        }
        $process = Start-Process -FilePath $installer -ArgumentList @(
          "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/SP-", "/CURRENTUSER", "/DIR=`"$innoDir`""
        ) -Wait -PassThru
        if ($process.ExitCode -ne 0) { throw "Inno Setup installation failed with exit code $($process.ExitCode)" }
        $iscc = Join-Path $innoDir "ISCC.exe"
        if (!(Test-Path $iscc)) { throw "Inno Setup compiler was not installed" }
        if (!(Test-Path (Join-Path $innoDir "Languages\ChineseSimplified.isl"))) {
          throw "Inno Setup bundled Chinese language file was not installed"
        }
        & $iscc --version
        if ($LASTEXITCODE -ne 0) { throw "Inno Setup compiler version check failed" }
        "MEDIAFORGE_ISCC=$iscc" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
    - name: Download staged package
      uses: actions/download-artifact@v4
      with:
        name: ${{ inputs.stage-artifact }}
        path: release/${{ inputs.stage-name }}
    - name: Build Inno Setup installer with LZMA2
      shell: pwsh
      env:
        MEDIAFORGE_VERSION: ${{ inputs.version }}
        MEDIAFORGE_PACKAGE_SUFFIX: ${{ inputs.package-suffix }}
      run: |
        $stageFull = (Resolve-Path "release/${{ inputs.stage-name }}").Path
        $releaseFull = (Resolve-Path "release").Path
        $drive = "Z:"
        subst $drive $stageFull
        if ($LASTEXITCODE -ne 0) { throw "Unable to map $stageFull to $drive" }
        try {
          $env:MEDIAFORGE_PORTABLE_DIR = $drive
          $env:MEDIAFORGE_INSTALLER_OUTPUT = $releaseFull
          & $env:MEDIAFORGE_ISCC "installer\mediaforge.iss"
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed with exit code $LASTEXITCODE" }
        } finally {
          subst $drive /D | Out-Null
        }
    # ---- SignPath 签名（可选）----
    # 只有在仓库配置了 SIGNPATH_ORGANIZATION_ID 时才执行；没配置就走了原来的未签名路径。
    # 先把安装包打成 zip 再上传：SignPath 的 artifact configuration 以 zip 为根更稳妥。
    - name: Package installer for signing
      if: ${{ vars.SIGNPATH_ORGANIZATION_ID != '' }}
      shell: pwsh
      run: |
        $target = "release/${{ inputs.output-file }}"
        if (!(Test-Path $target)) { throw "installer not found: $target" }
        New-Item -ItemType Directory -Force -Path "release/signing" | Out-Null
        Compress-Archive -Path $target -DestinationPath "release/signing/installer.zip" -Force

    - name: Upload installer for signing
      id: upload-signing
      if: ${{ vars.SIGNPATH_ORGANIZATION_ID != '' }}
      uses: actions/upload-artifact@v4
      with:
        name: signing-input-${{ inputs.output-file }}
        if-no-files-found: error
        path: release/signing/installer.zip

    - name: Submit SignPath signing request
      id: signpath
      if: ${{ vars.SIGNPATH_ORGANIZATION_ID != '' }}
      uses: signpath/github-action-submit-signing-request@v2
      with:
        api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
        organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
        project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
        signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
        artifact-configuration-slug: windows-installer
        github-artifact-id: ${{ steps.upload-signing.outputs.artifact-id }}
        wait-for-completion: true
        output-artifact-directory: release/signed

    - name: Replace installer with signed copy
      if: ${{ steps.signpath.outcome == 'success' }}
      shell: pwsh
      run: |
        $signedZip = Get-ChildItem release/signed -Recurse -Filter '*.zip' | Select-Object -First 1
        if (-not $signedZip) { throw "SignPath 没有返回签名产物" }
        $extract = "release/signed/extract"
        if (Test-Path $extract) { Remove-Item $extract -Recurse -Force }
        Expand-Archive -Path $signedZip.FullName -DestinationPath $extract -Force
        $signedExe = Get-ChildItem $extract -Recurse -Filter '*-setup.exe' | Select-Object -First 1
        if (-not $signedExe) { throw "签名产物里找不到安装包" }
        Copy-Item $signedExe.FullName "release/${{ inputs.output-file }}" -Force
        $sig = Get-AuthenticodeSignature "release/${{ inputs.output-file }}"
        Write-Host "Authenticode: $($sig.Status) $($sig.SignerCertificate.Subject)"
        if ($sig.Status -ne 'Valid') { throw "签名校验失败：$($sig.StatusMessage)" }

    - name: Upload Windows installer artifact
      uses: actions/upload-artifact@v4
      with:
        name: ${{ inputs.output-artifact }}
        path: release/${{ inputs.output-file }}
